<button
  type="button"
  class="theme-toggle"
  (click)="toggle()"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="theme() === 'dark'"
>
  @if (theme() === 'dark') {
    <svg
      class="theme-toggle__icon"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" fill="currentColor" />
    </svg>
  } @else {
    <svg
      class="theme-toggle__icon"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="4.5" fill="currentColor" />
      <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="12" y1="1.5" x2="12" y2="4" />
        <line x1="12" y1="20" x2="12" y2="22.5" />
        <line x1="22.5" y1="12" x2="20" y2="12" />
        <line x1="4" y1="12" x2="1.5" y2="12" />
        <line x1="19.07" y1="4.93" x2="17.3" y2="6.7" />
        <line x1="6.7" y1="17.3" x2="4.93" y2="19.07" />
        <line x1="19.07" y1="19.07" x2="17.3" y2="17.3" />
        <line x1="6.7" y1="6.7" x2="4.93" y2="4.93" />
      </g>
    </svg>
  }
</button>
